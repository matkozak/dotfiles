[tools]
node = "lts"
"npm:typescript" = "latest"
lua-language-server = "latest"
pnpm = "latest"
prettier = "latest"
rust = "stable"
stylua = "latest"
"pypi:pyright" = "latest"
"pypi:ruff" = "latest"

# Homebrew provides these on macOS (see macos/Brewfile)
bat = { version = "latest", os = ["linux"] }
codex = { version = "latest", os = ["linux"] }
fd = { version = "latest", os = ["linux"] }
fzf = { version = "latest", os = ["linux"] }
neovim = { version = "latest", os = ["linux"] }
rg = { version = "latest", os = ["linux"] }
tree-sitter = { version = "latest", os = ["linux"] }
uv = { version = "latest", os = ["linux"] }

[settings]
idiomatic_version_file_enable_tools = ["rust", "node"]
minimum_release_age = "7d"
# rust tracks rustup's stable channel, which is already vetted; with the delay
# mise up installs a pinned toolchain that mise prune then removes
minimum_release_age_excludes = ["rust"]
